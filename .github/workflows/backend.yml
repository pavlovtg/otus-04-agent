name: Backend CI

on:
  push:
  pull_request:

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build apps/backend/Backend.slnx --configuration Release

      - name: Test with coverage
        run: >
          dotnet test apps/backend/Backend.slnx
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Check coverage
        run: |
          REPORT=$(find ./coverage -name "coverage.cobertura.xml" | head -1)
          if [ -z "$REPORT" ]; then
            echo "Coverage report not found"
            exit 1
          fi
          LINE_RATE=$(grep -oP 'line-rate="\K[^"]+' "$REPORT" | head -1)
          COVERAGE=$(echo "$LINE_RATE * 100" | bc)
          echo "Coverage: ${COVERAGE}%"
          PASS=$(echo "$COVERAGE >= 90" | bc)
          if [ "$PASS" -ne 1 ]; then
            echo "Coverage ${COVERAGE}% is below 90%"
            exit 1
          fi
